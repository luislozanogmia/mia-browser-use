name: ghost
version: 0.4.0
description: "Control a signed-in Chrome window or the Hermes Desktop browser through authenticated local transports."
author: Luis Lozano
kind: standalone
provides_tools:
  - ghost_status
  - ghost_tab_list
  - ghost_tab_open
  - ghost_tab_switch
  - ghost_tab_close
  - ghost_navigate
  - ghost_vacuum
  - ghost_read
  - ghost_pdf_read
  - ghost_click
  - ghost_fill
  - ghost_key
  - ghost_eval
  - ghost_screenshot
  - ghost_scroll
  - ghost_wait
provides_hooks:
  - pre_llm_call
config_schema:
  backend:
    type: string
    required: false
    description: "Browser target: auto, chrome, or hermes. Defaults to auto."
  chrome_port:
    type: integer
    required: false
    description: "Authenticated Chrome bridge HTTP port. Defaults to 9378."
  allow_eval:
    type: boolean
    required: false
    description: "Explicitly enable arbitrary page JavaScript through ghost_eval. Defaults to false."
  page_context:
    type: boolean
    required: false
    description: "Tell the model which web page the user has open (URL and title) before each turn. Defaults to true."
